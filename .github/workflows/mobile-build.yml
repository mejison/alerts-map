name: Mobile builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios]
        default: all
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'netlify/client/**', 'public/**', 'ios/**', 'android/**', 'capacitor.config.ts', 'vite.mobile.config.ts', 'package*.json', '!app/download/**', '!components/download-landing.*', '!lib/app-downloads.json', '!netlify/client/download/**', '!public/illustrations/**', '!public/privacy/**']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  ONESIGNAL_DISABLE_LOCATION: 'true'

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Build Android preview APK
        run: bash android/gradlew -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: varta-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select installed stable Xcode 26
        shell: bash
        run: |
          VARTA_XCODE_PATH="$(node -e 'const fs=require("node:fs");const names=fs.readdirSync("/Applications").filter(name=>/^Xcode_26(?:\.\d+){1,2}\.app$/.test(name)).sort((a,b)=>a.localeCompare(b,"en",{numeric:true}));if(!names.length)throw Error("Xcode 26 is required");process.stdout.write("/Applications/"+names.at(-1)+"/Contents/Developer");')"
          sudo xcode-select --switch "$VARTA_XCODE_PATH"
          xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mobile
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Build for iOS Simulator without signing credentials
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -configuration Debug -derivedDataPath mobile-builds/ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent mobile-builds/ios/Build/Products/Debug-iphonesimulator/App.app mobile-builds/varta-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: varta-ios-simulator
          path: mobile-builds/varta-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
