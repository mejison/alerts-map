[build]
  command = "npm run build:netlify"
  publish = "dist-netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Vinext does not produce .next. Supported by Next.js Runtime >= 5.12.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200
  force = true

[[redirects]]
  from = "/api/push/config"
  to = "/.netlify/functions/push-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/push/subscription"
  to = "/.netlify/functions/push-subscription"
  status = 200
  force = true

[[redirects]]
  from = "/api/push/test"
  to = "/.netlify/functions/push-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/threat-history"
  to = "/.netlify/functions/threat-history"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/push/onesignal/OneSignalSDKWorker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
